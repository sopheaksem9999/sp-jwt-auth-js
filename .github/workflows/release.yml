name: Release
# Auto release: a push to main (stable) or develop (beta) publishes `package.json` version when
# no `v<version>` tag exists yet, then creates that tag and a GitHub Release whose notes come from the
# commits since the previous tag. Bump the version first (`pnpm changeset version`), commit and merge.
on:
  push:
    branches: [main, develop]

permissions:
  contents: write # create the tag and the GitHub Release
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Secret scan of the full git history, before anything is built or published. gitleaks is pinned by version
  # and its release checksum (published in gitleaks_8.30.1_checksums.txt); `.gitleaks.toml` extends the default rules.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history and working tree
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1
  publish:
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if [[ "$version" == *-* ]]; then channel=beta; want=develop; else channel=latest; want=main; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::notice::$version is a $channel version; it releases from $want, not $GITHUB_REF_NAME. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::notice::v$version already released. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.v.outputs.skip == 'false'
      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip == 'false'
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.v.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.v.outputs.skip == 'false'
        run: pnpm lint
      - if: steps.v.outputs.skip == 'false'
        run: pnpm typecheck
      # Build first so the dist-based tests run instead of skipping.
      - if: steps.v.outputs.skip == 'false'
        run: pnpm build
      - if: steps.v.outputs.skip == 'false'
        run: pnpm vitest run
        env:
          REQUIRE_DIST: '1'
      - if: steps.v.outputs.skip == 'false'
        run: pnpm check
        env:
          FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
      - name: Publish to npm (skipped when this version is already on the registry)
        if: steps.v.outputs.skip == 'false'
        run: |
          if npm view "${{ steps.v.outputs.name }}@${{ steps.v.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::already on npm"
          else
            npm publish --provenance --access public --tag "${{ steps.v.outputs.channel }}"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag and GitHub Release
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.v.outputs.version }}"
          if [ "${{ steps.v.outputs.channel }}" = latest ]; then
            prev=$(git describe --tags --abbrev=0 --match 'v*' --exclude 'v*-*' 2>/dev/null || true)
          else
            prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          fi
          node scripts/release-notes.mjs "${{ steps.v.outputs.version }}" "$prev" > "$RUNNER_TEMP/notes.md"
          flags=()
          [ "${{ steps.v.outputs.channel }}" = beta ] && flags+=(--prerelease)
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
